global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'recipe-parser'

scrape_configs:
  # Recipe Parser API metrics
  - job_name: 'recipe_api'
    static_configs:
      - targets: ['api:8001']
    metrics_path: '/metrics'

  # PostgreSQL metrics (if you add postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']

  # Redis metrics (if you add redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  # Ollama/LLM metrics (custom exporter)
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama:11434']
    metrics_path: '/metrics'

  # Node metrics for system monitoring
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
