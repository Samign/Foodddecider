server {
    listen 80;
    server_name localhost;

    # Root points to the mounted /var/www/html (your ./src folder)
    root /var/www/html;
    index index.php index.html;

    # 1. General frontend routing (handles /recipe/123 -> index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. CATCH ALL PHP FILES IN ALL SUBFOLDERS (src/, src/api/, src/auth/, etc.)
    location ~ \.php$ {
        # Check if file exists in ./src before passing to PHP
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_app:9000; # Sends to php container
        fastcgi_index index.php;
        include fastcgi_params;

        # Tells PHP where the file lives inside its container
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 3. ROUTE ONLY PYTHON API REQUESTS (Non-PHP Python FastAPI/Flask endpoints)
    # Note: Use a distinct prefix like /py-api/ or /parser-api/ so it doesn't collide with PHP's /api/ folder
    location /parser-api/ {
        proxy_pass http://recipe_api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hide dotfiles (.env, .git)
    location ~ /\. {
        deny all;
    }
}