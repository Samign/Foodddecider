server {
    listen 80;
    server_name localhost;

    # Root points to the mounted /var/www/html (your ./src folder)
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 10m;   # photo uploads (upload_image.php accepts up to 8 MB)

    # ── Security headers ──────────────────────────────────────────────
    # The CSP is the safety net if an XSS bug ever slips through: scripts only from this site
    # (no inline <script>, no onclick=...), fonts from Google, everything else from this site.
    # NOTE: nginx drops these in any location that has its own add_header, see /uploads/ below.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ── Uploaded pictures ─────────────────────────────────────────────
    # File names change whenever a picture changes, so they can be cached for a long time.
    # Nothing in here is ever run as PHP, and SVG avatars can't run scripts.
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1h;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # A. Clean Route: /user/username -> user.php?username=username
    location ~ ^/user/([^/]+)$ {
        try_files /user.php =404;
        fastcgi_pass php_app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/user.php;
        fastcgi_param QUERY_STRING username=$1;
    }

    # B. Clean Route: /results -> search_page.php (preserves ?q=query automatically)
    location = /results {
        try_files /search_page.php =404;
        fastcgi_pass php_app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/search_page.php;
    }

    # 1. General frontend routing (handles /recipe/123 -> index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 2. CATCH ALL PHP FILES IN ALL SUBFOLDERS (src/, src/api/, src/auth/, etc.)
    location ~ \.php$ {
        # Check if file exists in ./src before passing to PHP
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php_app:9000; # Sends to php container
        fastcgi_index index.php;
        include fastcgi_params;

        # Tells PHP where the file lives inside its container
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # 3. The recipe parser (Python) is NOT exposed here on purpose. It used to be at /parser-api/,
    #    which let anyone, logged in or not, run the LLM and make the server fetch any URL,
    #    including internal ones. PHP reaches it directly at http://api:8001
    #    (api/recipes/import_recipe_url.php), behind the login check.

    # Hide dotfiles (.env, .git)
    location ~ /\. {
        deny all;
    }
}