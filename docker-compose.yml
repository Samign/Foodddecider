services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  adminer:
    image: adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"   # database admin: only from this machine

  # Redis for caching and Celery broker
  # redis:
  #   image: redis:7-alpine
  #   container_name: recipe_redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - ./redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  # Ollama for LLM inference (GPU enabled)
  ollama:
    image: ollama/ollama:latest
    container_name: recipe_ollama
    ports:
      - "127.0.0.1:11434:11434" # only this machine; nobody else should run your model
    volumes:
      - ./ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_ORIGINS=*
    # healthcheck:
    #   test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5

  # Recipe Parser API
  api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: recipe_api
    ports:
      - "127.0.0.1:8001:8001"   # only this machine; PHP reaches it as http://api:8001
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/fooddecider
      # - REDIS_URL=redis://redis:6379/0
      - OLLAMA_ENDPOINT=http://ollama:11434/api/generate
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  # Celery Worker for background tasks
  # celery_worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.python
  #   container_name: recipe_celery_worker
  #   command: celery -A tasks worker --loglevel=info --concurrency=4
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/recipes
  #     - REDIS_URL=redis://redis:6379/0
  #     - OLLAMA_ENDPOINT=http://ollama:11434/api/generate
  #   depends_on:
  #     - db
  #     - redis
  #     - ollama
  #   restart: unless-stopped

  # Celery Beat for scheduled tasks
  # celery_beat:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.python
  #   container_name: recipe_celery_beat
  #   command: celery -A tasks beat --loglevel=info
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/recipes
  #     - REDIS_URL=redis://redis:6379/0
  #   depends_on:
  #     - db
  #     - redis
  #   restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: recipe_prometheus
    ports:
      - "127.0.0.1:9090:9090"   # metrics have no login: only from this machine
    volumes:
      - ./prometheus.yml:/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: recipe_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${POSTGRES_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: recipe_nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./src:/var/www/html:ro
    depends_on:
      - api
      - php
    restart: unless-stopped

volumes:
  # redis_data:
  # ollama_data:
  prometheus_data:
  grafana_data:
  pgdata:
    # # # # # # # # # driver: local

networks:
  default:
    name: recipe_network